<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Mega Cars</title>
    <link rel="stylesheet" href="../css/auth.css">
    <script src="../js/i18n.js"></script>
</head>
<body class="auth-body">
    <button id="langToggleBtn" class="lang-toggle-btn lang-toggle-floating" onclick="toggleLang()">EN</button>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-logo">
                <img src="../images/logo.png" alt="Mega Cars Logo">
                <h1>Mega Cars</h1>
            </div>

            <h2 data-i18n="login.title">تسجيل الدخول</h2>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email" data-i18n="login.email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password" data-i18n="login.password">كلمة المرور</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary" data-i18n="login.submit">تسجيل الدخول</button>
            </form>

            <p class="auth-link">
                <span data-i18n="login.noAccount">ليس لديك حساب؟</span>
                <a href="register.html" data-i18n="login.register">سجّل هنا</a>
            </p>
            <a href="../index.html" class="back-link" data-i18n="login.backHome">← العودة للرئيسية</a>
        </div>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
